<div class="p-6 max-w-7xl mx-auto bg-white shadow-sm rounded-lg border border-gray-200">
  <form [formGroup]="form" class="space-y-4">

    <div class="form-spacing">
      <!-- Primera fila -->
      <div class="form-column4">
        <!-- Naturaleza de entidad -->
        <fieldset class="naturaleza">
          <label class="text-sm font-medium text-gray-700">Naturaleza de la entidad</label>

          <div class="options">
            <div class="option-nat">
              <input type="radio" name="naturaleza" id="priv" value="Privada" formControlName="naturaleza">
              <label for="priv" class="text-sm font-medium text-gray-700">Privada</label>
            </div>

            <div class="option-nat">
              <input type="radio" name="naturaleza" id="pub" value="Pública" formControlName="naturaleza">
              <label for="pub" class="text-sm font-medium text-gray-700">Pública</label>
            </div>

            <div class="option-nat">
              <input type="radio" name="naturaleza" id="mix" value="Mixta" formControlName="naturaleza">
              <label for="mix" class="text-sm font-medium text-gray-700">Mixta</label>
            </div>
          </div>
          <div class="text-red-500 text-xs mt-1"
            *ngIf="form.get('naturaleza')?.invalid && form.get('naturaleza')?.touched">
            Campo obligatorio
          </div>
        </fieldset>

        <!-- Código CIIU -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Código CIIU <span class="text-red-500">*</span>
          </label>
          <input id="codigo_ciiu" type="text" formControlName="codigo_ciiu" maxlength="10"
            (keypress)="soloNumeros($event)" class="input-field" placeholder="Ej: 1234567890">
          <div class="text-red-500 text-xs mt-1"
            *ngIf="form.get('codigo_ciiu')?.invalid && form.get('codigo_ciiu')?.touched">
            <span *ngIf="form.get('codigo_ciiu')?.errors?.['required']">Campo obligatorio</span>
            <span *ngIf="form.get('codigo_ciiu')?.errors?.['minlength']">Mínimo 3 dígitos</span>
          </div>
        </div>

        <!-- Detalle de la actividad económica principal -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Detalle de la actividad eonómica principal <span class="text-red-500">*</span>
          </label>
          <input id="actividad_economia" type="text" formControlName="actividad_economia" maxlength="200"
            (keypress)="soloLetras($event)" class="input-field" placeholder="Ej: Placeholder">
          <div class="text-red-500 text-xs mt-1"
            *ngIf="form.get('actividad_economia')?.invalid && form.get('actividad_economia')?.touched">
            <span *ngIf="form.get('actividad_economia')?.errors?.['required']">Campo obligatorio</span>
            <span *ngIf="form.get('actividad_economia')?.errors?.['minlength']">Mínimo 3 dígitos</span>
          </div>
        </div>

        <!-- Número de empleados -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            No. empleados
          </label>
          <input id="num_empleados" type="number" formControlName="num_empleados" class="input-field" placeholder="Ej: 10">
        </div>

      </div>

      <!-- Segunda fila -->
      <div class="fila-normal">

        <!-- Sociedad comercial o civil -->
        <div class="input-stuff">
          <label for="tipo_sociedad" class="block text-sm font-medium text-gray-700 mb-2">
            Sociedad comercial o civil <span class="text-red-500">*</span>
          </label>
          <select id="tipo_sociedad" formControlName="tipo_sociedad" class="input-field">
            <option value="" selected>Seleccione el tipo de sociedad</option>
            <option value="Por acciones simplificadas S.A.S">Por acciones simplificadas S.A.S</option>
            <option value="Anónima">Anónima</option>
            <option value="Limitada">Limitada</option>
            <option value="En comandita simple">En comandita simple</option>
            <option value="En comandita por acciones">En comandita por acciones</option>
            <option value="Sucursal de sociedad extranjera">Sucursal de sociedad extranjera</option>
            <option value="Sin animo de lucro">Sin animo de lucro</option>
            <option value="Empresa unirpersonal">Empresa unirpersonal</option>
            <option value="Asociación civil">Asociación civil</option>
            <option value="Colectiva">Colectiva</option>
            <option value="Otra">Otra</option>
          </select>
          <div class="text-red-500 text-xs mt-1"
            *ngIf="form.get('tipo_sociedad')?.invalid && form.get('tipo_sociedad')?.touched">Campo obligatorio
          </div>
        </div>


        <!-- Tipo entidad -->
        <div class="input-stuff">

          <label for="tipo_asociacion" class="block text-sm font-medium text-gray-700 mb-2">
            Tipo de entidad/asociación <span class="text-red-500">*</span>
          </label>

          <select id="tipo_asociacion" formControlName="tipo_asociacion" class="input-field">
            <option value="" selected>Seleccione el tipo de entidad/asociación</option>
            <option value="Establecimiento público"> Establecimiento público </option>
            <option value="Empresa social del estado">Empresa social del estado</option>
            <option value="Empresa servicios públicos domiciliarios">Empresa servicios públicos domiciliarios</option>
            <option value="Entidades financieras">Entidades financieras</option>
            <option value="Fondos mutuos de inversión">Fondos mutuos de inversión</option>
            <option value="Fondos de empleados">Fondos de empleados</option>
            <option value="Cooperativas">Cooperativas</option>
            <option value="Precooperativas">Precooperativas</option>
            <option value="Copropiedades">Copropiedades</option>
            <option value="Personas jurídicas de derecho canónico">Personas jurídicas de derecho canónico</option>
            <option value="Entidades religiosas no católicas">Entidades religiosas no católicas</option>
            <option value="Sindicatos">Sindicatos</option>
            <option value="Fundaciones">Fundaciones</option>
            <option value="Corporaciones y asociaciones">Corporaciones y asociaciones</option>
            <option value="Partido político">Partido político</option>
            <option value="Consorcio">Consorcio</option>
            <option value="Unión temporal">Unión temporal</option>
            <option value="Otra">Otra</option>
          </select>
          <div class="text-red-500 text-xs mt-1"
            *ngIf="form.get('tipo_asociacion')?.invalid && form.get('tipo_asociacion')?.touched">
            Campo obligatorio
          </div>
        </div>

      </div>

      <!-- Tercera fila -->
      <div>

        <!-- Entidad estatal -->
        <fieldset class="ent-estatales">
          <legend class="text-sm font-medium text-gray-700">
            Entidades estatales
          </legend>
          <div class="options">
            <div class="option-nat">
              <input type="radio" id="nacion" value="Nación" formControlName="ent_estatal">
              <label for="nacion">Nación</label>
            </div>
            <div class="option-nat">
              <input type="radio" id="departamento" value="Departamento" formControlName="ent_estatal">
              <label for="departamento">Departamento</label>
            </div>
            <div class="option-nat">
              <input type="radio" id="municipio1" value="Municipio" formControlName="ent_estatal">
              <label for="municipio1">Municipio</label>
            </div>
            <div class="option-nat">
              <input type="radio" id="otra" value="Otra" formControlName="ent_estatal">
              <label for="otra">Otra</label>
            </div>
          </div>
          <!-- Solo aparece si selecciona la opción Otra -->
          <div class="input-otra mt-3" *ngIf="form.get('ent_estatal')?.value === 'Otra'">
            <input type="text" formControlName="otra_ent_estatal" maxlength="100" (keypress)="soloLetras($event)"
              class="input-field" placeholder="Ej: Placeholder">
          </div>
          <div class="text-red-500 text-xs mt-1"
            *ngIf="form.get('otra_ent_estatal')?.invalid && form.get('otra_ent_estatal')?.touched">
            <span *ngIf="form.get('otra_ent_estatal')?.errors?.['required']">Campo obligatorio</span>
            <span *ngIf="form.get('otra_ent_estatal')?.errors?.['minlength']">Mínimo 3 dígitos</span>
          </div>
        </fieldset>

        <!-- Entidad descentralizada -->
        <fieldset class="ent-descentralizada">
          <legend class="text-sm font-medium text-gray-700">
            Entidades estatales descentralizadas
          </legend>
          <div class="options">
            <div class="option-nat">
              <input type="radio" id="nacional" value="Nacional" formControlName="ent_estatal_descentralizada">
              <label for="nacional">Nacional</label>
            </div>
            <div class="option-nat">
              <input type="radio" id="departamental" value="Departamental"
                formControlName="ent_estatal_descentralizada">
              <label for="departamental">Departamental</label>
            </div>
            <div class="option-nat">
              <input type="radio" id="municipio2" value="Municipio" formControlName="ent_estatal_descentralizada">
              <label for="municipio2">Municipio</label>
            </div>
          </div>
        </fieldset>
      </div>

    </div>

    <!-- Botones -->
    <div class="flex justify-between mt-6">
      <button type="button" (click)="volver()" class="form-btn">Volver a la página anterior</button>
      <button type="button" (click)="guardarSeccion()" [disabled]="form.invalid" class="form-btn">
        Guardar y continuar
      </button>
    </div>

  </form>
</div>
