<div class="p-6 max-w-7xl mx-auto bg-white shadow-sm rounded-lg border border-gray-200">
  <form [formGroup]="form" class="space-y-4">
    <div class="form-spacing">

      <!-- Número de NIT -->
      <div class="input-stuff">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Número de NIT <span class="text-red-500">*</span>
        </label>
        <input id="nit" type="text" formControlName="nit" maxlength="10" pattern="[0-9]*"
          (keypress)="soloNumeros($event)" class="input-field" placeholder="Ej: 1234567890">
        <div class="text-red-500 text-xs mt-1" *ngIf="form.get('nit')?.invalid && form.get('nit')?.touched">
          <span *ngIf="form.get('nit')?.errors?.['required']">Campo obligatorio</span>
          <span *ngIf="form.get('nit')?.errors?.['minlength']">Mínimo 8 dígitos</span>
        </div>
      </div>

    </div>

    <!-- Botones -->
    <div class="flex justify-between mt-6">
      <button type="button" (click)="volver()" class="form-btn">Volver a la página anterior</button>
      <button type="button" (click)="guardarSeccion()" [disabled]="form.invalid" class="form-btn">
        Guardar y continuar
      </button>
    </div>

  </form>
</div>
