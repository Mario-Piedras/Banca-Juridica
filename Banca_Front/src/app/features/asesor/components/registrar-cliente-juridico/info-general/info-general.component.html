<div class="p-6 max-w-7xl mx-auto bg-white shadow-sm rounded-lg border border-gray-200">
  <form [formGroup]="form" class="space-y-4">
    <div>

      <!-- Número de NIT -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Número de NIT <span class="text-red-500">*</span>
        </label>
        <input id="numeroNIT" type="tel" formControlName="numeroNIT" maxlength="10" pattern="[0-9]*"
          (keypress)="soloNumeros($event)"
          class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej: 1234567890">
      </div>

      <!-- Nombre o razón social -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Nombre o razón social <span class="text-red-500">*</span>
        </label>
        <input id="nombreRazon" type="text" formControlName="nombreRazon" maxlength="100" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
          (keypress)="soloLetras($event)"
          class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej: Placeholder">
      </div>

      <!-- Varios -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Nombre corto o sigla -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Nombre corto o sigla <span class="text-red-500">*</span>
          </label>
          <input id="nombreSigla" type="text" formControlName="nombreSigla" maxlength="10" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
            (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Placeholder">
        </div>

        <!-- Fecha de constitución -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Fecha de constitución <span class="text-red-500">*</span>
          </label>
          <input id="fechaConstitucion" type="date" formControlName="fechaConstitucion" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- País de constitución -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            País de constitución <span class="text-red-500">*</span>
          </label>
          <input id="paisConstitucion" type="text" formControlName="paisConstitucion" maxlength="50" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
            (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Colombia">
        </div>

        <!-- Ciudad de constitución -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Ciudad de constitución <span class="text-red-500">*</span>
          </label>
          <input id="ciudadConstitucion" type="text" formControlName="ciudadConstitucion" maxlength="50" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
          (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Palmira">
        </div>

      </div>

      <!-- Dirección sede principal -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Dirección sede principal <span class="text-red-500">*</span>
        </label>
        <input id="direccionEmpresa" type="text" maxlength="50"
          class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej: Cl. 40 #30-44">
      </div>

      <!-- Varios2 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- País -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            País <span class="text-red-500">*</span>
          </label>
          <input id="paisEmpresa" type="text" maxlength="50" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
          (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Colombia">
        </div>

        <!-- Teléfono -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Teléfono <span class="text-red-500">*</span>
          </label>
          <input id="telefonoEmpresa" type="tel" maxlength="20" pattern="[0-9]*"
          (keypress)="soloNumeros($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: 1234567890">
        </div>

        <!-- Extensión -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Extensión <span class="text-red-500">*</span>
          </label>
          <input id="extensionEmpresa" type="text" maxlength="5" pattern="[0-9]*"
          (keypress)="soloNumeros($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: 1234567890">
        </div>

        <!-- Barrio -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Barrio <span class="text-red-500">*</span>
          </label>
          <input id="barrioEmpresa" type="text" maxlength="50" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
          (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Placeholder">
        </div>

        <!-- Ciudad/Municipio -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Ciudad/Municipio <span class="text-red-500">*</span>
          </label>
          <input id="ciudadEmpresa" type="text" maxlength="50" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
          (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Palmira">
        </div>

        <!-- Departamento -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Departamento <span class="text-red-500">*</span>
          </label>
          <input id="departamentoEmpresa" type="text" maxlength="50" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*"
          (keypress)="soloLetras($event)"
            class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Valle del cauca">
        </div>

      </div>

      <!-- Correo electrónico sede principal -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Correo electrónico sede principal <span class="text-red-500">*</span>
        </label>
        <input id="correoSede" type="email" maxlength="100"
          class="placeholder-gray-400 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej: correo@example.com">
      </div>

    </div>

    <!-- Botón Guardar -->
    <div class="flex justify-end mt-6">
      <button type="button" (click)="guardarSeccion()" [disabled]="!form.valid" [class]="form.valid
      ? 'px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors cursor-pointer'
      : 'px-6 py-2 bg-gray-300 text-gray-500 font-medium rounded-lg cursor-not-allowed'">
        Guardar y Continuar
      </button>
    </div>

  </form>
</div>
